name: CI

on:
    push:
        branches: [ main ]
    pull_request:

permissions:
    contents: read
    packages: write

jobs:
    format:
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-format.yml@main
        secrets:
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
        
    tests:
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-tests.yml@main
        secrets:
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

    sonar:
        needs: tests
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-sonar.yml@main
        with:
          project-key: ${{ vars.SONAR_PROJECT_KEY }}
        secrets:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

    aot:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: '10.0.x'
            - name: Publish Native AOT smoke tests
              run: dotnet publish tests/PANiXiDA.Core.Presentation.Http.AotSmoke -c Release -r linux-x64 -o "${{ runner.temp }}/http-aot"
            - name: Run Native AOT smoke tests
              run: '"${{ runner.temp }}/http-aot/PANiXiDA.Core.Presentation.Http.AotSmoke"'

    sonar-details:
        if: ${{ failure() && needs.sonar.result == 'failure' }}
        needs: sonar
        runs-on: ubuntu-latest
        steps:
            - name: Report failed Quality Gate conditions
              env:
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
                  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
                    --get "${SONAR_HOST_URL}/api/qualitygates/project_status" \
                    --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
                    | jq '.projectStatus | {status, conditions}'
                  curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
                    --get "${SONAR_HOST_URL}/api/issues/search" \
                    --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
                    --data-urlencode "resolved=false" \
                    --data-urlencode "ps=100" \
                    | jq '.issues[] | {rule, message, component, line}'

    publish:
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      needs: 
        - format
        - tests
        - sonar
        - aot
      uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-publish-global-nuget.yml@main
      secrets:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    notify:
      if: ${{ always() && github.event_name != 'pull_request' }}
      needs: [ publish ]
      uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
      with:
        event-name: ${{ github.event_name }}    
      secrets:
        telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
        github-token: ${{ secrets.REGISTRY_TOKEN }}
